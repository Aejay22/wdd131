<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Form</title>
    <link rel="stylesheet" href="./styles/form.css">
    <script src="./scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name*</label>
            <select id="product" name="product" required class="select">
                <option value="" disabled selected>Select a Product ...</option>
            </select>
            <label>Overall Rating*</label>
            <div class="stars">
                <input type="radio" id="star5" name="stars" value="5" required><label for="star5"></label>
        
                <input type="radio" id="star4" name="stars" value="4" required><label for="star4"></label>
        
                <input type="radio" id="star3" name="stars" value="3" required><label for="star3"></label>
        
                <input type="radio" id="star2" name="stars" value="2" required><label for="star2"></label>
        
                <input type="radio" id="star1" name="stars" value="1" required><label for="star1"></label>

            </div>

            <label for="date">Date of installation*</label>
            <input type="date" name="date" id="date" required>

            <hr>

            <label>Which features did you find useful in he product? <em>(Click all that apply)</em></label>
            <div class="checkbox">
                <label><input value="duragility" type="checkbox" id="durability" name="design">Durability</label>
                <label><input value="ease" type="checkbox" id="ease" name="design">Ease of Use</label>
                <label><input value="performance" type="checkbox" id="performance" name="design">Performance</label>
                <label><input value="design" type="checkbox" id="design" name="design">Design</label>
            </div>

            <label for="written">Written Review(Optional)</label>
            <textarea name="written" id="written" cols="4"></textarea>

            <label for="name">Your Name(Optional)</label>
            <input type="text" id="name" name="nam">
            <input type="submit" value="Post Review" class="review">
        </form>
    </main>
    <footer>
        <p>&copy;<span class="year"></span> Joshua Uyinosagbon Anthony Nigeria</p>
        <p>Last Modification: <span class="lastModified"></span></p>
    </footer>
</body>
</html>
